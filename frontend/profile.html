<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Profile | SmartQueue Bank</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <div class="dashboard-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="customer-dashboard.html" class="sidebar-brand">
                    <div class="brand-icon"><i class="fas fa-landmark"></i></div>
                    <span>Smart<span>Queue</span></span>
                </a>
            </div>

            <div class="sidebar-menu">
                <div class="menu-label">Main Navigation</div>
                <div class="nav-item">
                    <a href="customer-dashboard.html" class="nav-link">
                        <i class="fas fa-th-large"></i> Dashboard
                    </a>
                </div>
                <div class="nav-item">
                    <a href="book-token.html" class="nav-link">
                        <i class="fas fa-ticket-alt"></i> Book Token
                    </a>
                </div>
                <div class="nav-item">
                    <a href="my-token.html" class="nav-link">
                        <i class="fas fa-id-card-alt"></i> My Token
                    </a>
                </div>
                <div class="nav-item">
                    <a href="queue-status.html" class="nav-link">
                        <i class="fas fa-stream"></i> Queue Status
                    </a>
                </div>
                <div class="nav-item">
                    <a href="services.html" class="nav-link">
                        <i class="fas fa-concierge-bell"></i> Services
                    </a>
                </div>
                <div class="nav-item">
                    <a href="profile.html" class="nav-link active">
                        <i class="fas fa-user-circle"></i> Profile
                    </a>
                </div>
            </div>

            <div class="sidebar-footer">
                <div class="user-snippet">
                    <div class="user-avatar" id="user-avatar">C</div>
                    <div class="user-info">
                        <div class="user-name" id="user-display-name">Customer</div>
                        <div class="user-role" id="user-display-role">Verified Customer</div>
                    </div>
                </div>
                <button class="logout-btn" onclick="logout()" title="Logout">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <div class="main-wrapper">
            <header class="top-bar">
                <div style="display:flex; align-items:center; gap:16px;">
                    <button id="sidebar-toggle-btn" class="mobile-menu-btn" style="display:inline-block;">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div class="top-bar-title">
                        <h1>Customer Profile</h1>
                        <p>Manage your contact info for SMS queue alerts</p>
                    </div>
                </div>
            </header>

            <main class="content-body" style="max-width:720px;">
                <div class="table-card" style="padding:32px;">
                    <form id="profile-form">
                        <div style="margin-bottom:20px;">
                            <label class="form-label" for="prof-name">Full Name</label>
                            <input type="text" id="prof-name" class="form-control" style="padding-left:14px;" required>
                        </div>

                        <div style="margin-bottom:20px;">
                            <label class="form-label" for="prof-email">Email Address (Registered)</label>
                            <input type="email" id="prof-email" class="form-control" style="padding-left:14px; background:#f1f5f9;" readonly>
                            <small style="color:var(--text-muted);">Email cannot be changed.</small>
                        </div>

                        <div style="margin-bottom:20px;">
                            <label class="form-label" for="prof-phone">Phone Number (For Queue SMS Alerts)</label>
                            <input type="tel" id="prof-phone" class="form-control" style="padding-left:14px;" required>
                        </div>

                        <div style="margin-bottom:28px;">
                            <label class="form-label" for="prof-address">Residential Address / City</label>
                            <textarea id="prof-address" class="form-control" style="padding:12px; height:90px;"></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Save Profile Changes
                        </button>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>requireAuth(['customer']);</script>
    <script src="js/customer.js"></script>
</body>
</html>
