<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration | SmartQueue Bank</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card" style="max-width: 520px;">
            <div class="auth-header">
                <a href="index.html" class="auth-logo">
                    <div class="brand-icon"><i class="fas fa-landmark"></i></div>
                    <span>SmartQueue Bank</span>
                </a>
                <h2>Create Customer Account</h2>
                <p>Register once, book priority tokens anytime</p>
            </div>

            <form id="register-form">
                <div class="form-group">
                    <label class="form-label" for="reg-name">Full Name *</label>
                    <div class="input-group">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" id="reg-name" class="form-control" placeholder="e.g. Keerthiya Sundar" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="reg-email">Email Address *</label>
                        <div class="input-group">
                            <i class="fas fa-envelope input-icon"></i>
                            <input type="email" id="reg-email" class="form-control" placeholder="name@example.com" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="reg-phone">Phone Number *</label>
                        <div class="input-group">
                            <i class="fas fa-phone input-icon"></i>
                            <input type="tel" id="reg-phone" class="form-control" placeholder="+91 98765 43210" required>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-address">Address / City</label>
                    <div class="input-group">
                        <i class="fas fa-map-marker-alt input-icon"></i>
                        <input type="text" id="reg-address" class="form-control" placeholder="e.g. Anna Nagar, Chennai">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="reg-password">Password *</label>
                        <div class="input-group">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="reg-password" class="form-control" placeholder="Min. 6 chars" required minlength="6">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="reg-confirm-password">Confirm Password *</label>
                        <div class="input-group">
                            <i class="fas fa-shield-alt input-icon"></i>
                            <input type="password" id="reg-confirm-password" class="form-control" placeholder="Re-enter password" required minlength="6">
                        </div>
                    </div>
                </div>

                <div class="form-check" style="margin-bottom:20px;">
                    <input type="checkbox" id="terms" required checked>
                    <label for="terms">I agree to SmartQueue Bank terms of digital service & privacy policy</label>
                </div>

                <button type="submit" class="btn btn-primary auth-btn">
                    <i class="fas fa-user-check"></i> Complete Registration
                </button>
            </form>

            <div class="auth-footer">
                Already registered? <a href="login.html">Sign In here</a>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
