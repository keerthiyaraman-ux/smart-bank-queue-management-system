<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banking Services | SmartQueue Bank</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <div class="dashboard-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="customer-dashboard.html" class="sidebar-brand">
                    <div class="brand-icon"><i class="fas fa-landmark"></i></div>
                    <span>Smart<span>Queue</span></span>
                </a>
            </div>

            <div class="sidebar-menu">
                <div class="menu-label">Main Navigation</div>
                <div class="nav-item">
                    <a href="customer-dashboard.html" class="nav-link">
                        <i class="fas fa-th-large"></i> Dashboard
                    </a>
                </div>
                <div class="nav-item">
                    <a href="book-token.html" class="nav-link">
                        <i class="fas fa-ticket-alt"></i> Book Token
                    </a>
                </div>
                <div class="nav-item">
                    <a href="my-token.html" class="nav-link">
                        <i class="fas fa-id-card-alt"></i> My Token
                    </a>
                </div>
                <div class="nav-item">
                    <a href="queue-status.html" class="nav-link">
                        <i class="fas fa-stream"></i> Queue Status
                    </a>
                </div>
                <div class="nav-item">
                    <a href="services.html" class="nav-link active">
                        <i class="fas fa-concierge-bell"></i> Services
                    </a>
                </div>
                <div class="nav-item">
                    <a href="profile.html" class="nav-link">
                        <i class="fas fa-user-circle"></i> Profile
                    </a>
                </div>
            </div>

            <div class="sidebar-footer">
                <div class="user-snippet">
                    <div class="user-avatar" id="user-avatar">C</div>
                    <div class="user-info">
                        <div class="user-name" id="user-display-name">Customer</div>
                        <div class="user-role" id="user-display-role">Verified Customer</div>
                    </div>
                </div>
                <button class="logout-btn" onclick="logout()" title="Logout">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <div class="main-wrapper">
            <header class="top-bar">
                <div style="display:flex; align-items:center; gap:16px;">
                    <button id="sidebar-toggle-btn" class="mobile-menu-btn" style="display:inline-block;">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div class="top-bar-title">
                        <h1>Available Banking Services</h1>
                        <p>Browse dedicated service counters and reserve appointments</p>
                    </div>
                </div>
            </header>

            <main class="content-body">
                <div class="services-grid" id="customer-services-container">
                    <!-- Populated dynamically via customer.js -->
                    <div style="padding:32px; color:var(--text-muted);"><i class="fas fa-spinner fa-spin"></i> Loading services...</div>
                </div>
            </main>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>requireAuth(['customer']);</script>
    <script src="js/customer.js"></script>
</body>
</html>
