<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration Console Login | SmartQueue Bank</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="auth-logo">
                    <div class="brand-icon" style="background:linear-gradient(135deg, #ef4444, #b91c1c);"><i class="fas fa-shield-alt"></i></div>
                    <span>SmartQueue Bank</span>
                </a>
                <h2>Administration Console</h2>
                <p>Global branch management, queue analytics, and staff oversight</p>
                <span class="auth-role-tag admin"><i class="fas fa-user-shield"></i> Super Admin</span>
            </div>

            <form id="login-form" data-role="admin">
                <div class="form-group">
                    <label class="form-label" for="login-email">Administrator Email</label>
                    <div class="input-group">
                        <i class="fas fa-envelope-open-text input-icon"></i>
                        <input type="email" id="login-email" class="form-control" placeholder="admin@smartqueue.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="login-password">Master Password</label>
                    <div class="input-group">
                        <i class="fas fa-key input-icon"></i>
                        <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary auth-btn" style="background:linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);">
                    <i class="fas fa-lock"></i> Authorize Admin Session
                </button>
            </form>

            <div class="auth-footer">
                <a href="index.html"><i class="fas fa-arrow-left"></i> Home</a> &bull;
                <a href="login.html">Customer Sign In</a> &bull;
                <a href="staff-login.html">Staff Sign In</a>
            </div>

            <!-- Demo Account Quick Fill Helper -->
            <div class="demo-credentials-box">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span><strong>Demo Admin:</strong> admin@smartqueue.com</span>
                    <button type="button" class="demo-fill-btn" onclick="fillDemo('admin@smartqueue.com', 'admin123')">Auto-Fill</button>
                </div>
                <div style="font-size:0.75rem; color:#94a3b8; margin-top:2px;">Password: admin123</div>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
